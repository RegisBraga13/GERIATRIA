<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1C2B33" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F3EAE0" media="(prefers-color-scheme: light)" />

    <title>Prontuário Geriátrico — Dr. Regis Braga</title>
    <meta name="description" content="Prontuário eletrônico geriátrico de uso clínico privado: anamnese, exame físico, evolução e prescrição." />
    <!-- Sistema clínico com dado sensível de paciente: nunca deve ser indexado. -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="referrer" content="no-referrer" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Ícone inline: evita duas requisições 404 por carga (a pasta images/ não existe). -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231C2B33'/%3E%3Ctext x='16' y='21' font-family='Outfit,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' fill='%238FADC6' text-anchor='middle'%3ERB%3C/text%3E%3C/svg%3E"
    />

    <!-- A fonte só é descoberta depois de baixar e parsear o CSS; o preload antecipa. -->
    <link rel="preload" href="fonts/Outfit-Variable-latin.woff2" as="font" type="font/woff2" crossorigin />

    <link rel="stylesheet" href="src/styles/theme.css" />
    <link rel="stylesheet" href="src/styles/responsive.css" />
  </head>
  <body>
    <a class="skip-link" href="#app">Ir para o conteúdo</a>
    <div id="app" role="main"></div>
    <script type="module" src="src/App.js"></script>
    <script src="src/bootstrap.js" defer></script>
  </body>
</html>
